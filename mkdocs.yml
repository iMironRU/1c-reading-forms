site_name: Чтение форм 1С
site_description: Учебный курс для новичков — как устроены формы 1С и как их читать
site_author: iMironRU
# site_url: https://imironru.github.io/1c-forms-reading/   # раскомментировать после создания репозитория
# repo_url: https://github.com/iMironRU/1c-forms-reading
# repo_name: iMironRU/1c-forms-reading
# edit_uri: edit/main/chapters/

docs_dir: chapters

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue-grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue-grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: false
  - pymdownx.inlinehilite
  - toc:
      permalink: true
      title: Содержание раздела

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iMironRU

